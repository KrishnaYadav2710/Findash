services:
  - type: web
    name: finsight-ai
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FINSIGHT_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: USAGE_LOG_PATH
        value: /var/data/finsight-usage.xlsx
    disk:
      name: finsight-usage
      mountPath: /var/data
      sizeGB: 1
